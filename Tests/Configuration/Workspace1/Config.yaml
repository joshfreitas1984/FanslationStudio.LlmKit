retryCount: 4
batchSize: 20000
skipLineValidation: false
correctionPromptsEnabled: true
translateFlagged: true
glossaryPreset:
  usePresetChineseGlossary: true
  chineseGlossaryTypesToSupress:
    - Phonetics  
models: 
  - name: Standard
    modelPreset: Qwen25
    url: "http://localhost/standard"
    overridePromptFolder: "StandardPrompts"
  - name: Structured
    modelPreset: Qwen25  
    modelPresetType: StructuredText
    url: "http://localhost/structured"
    apiKeyRequired: true
    overridePromptFolder: "StructuredPrompts"
