- name: ConvertedCorpus-20260920-mining
  path: Files/Converted
  sampleFingerprint: n/a - not a TranslationAssessmentWorkflow run
  sampleSize: n/a
  sampleSeed: n/a
  selection: >-
    30 detection items hand-mined directly from Files/Converted's ~81,165 real production splits (not from a ModelAssessment run - there is no fingerprint/seed to record). Candidates use each row's pre-QC "translated" field as a single-candidate "ProductionTranslation" column, judged independently of whatever qcStatus/qcDefectCategory that row already carries in production (to avoid circularity - see docs/plans/qc-evaluator-comparison.md's Fifteenth round entry). Selected for diversity across file types (PlotData, dynamicStrings, dynamicStringsFromColumns, dynamicStringsPoetry, dumpedPrefabText(FromOtherFields), KungFuData, SpeAddDataBase, SpeHeroData, heroFullNames) and defect categories (mistranslation, fabricated-content, formatting, garbage-output, fluency), with a deliberate emphasis on lines carrying 2+ placeholders (#Token# and the game's ⟦n⟧ bracket style) in a single line, since the gold set previously had only one such example. Items sourced from this batch set sampleRun: ConvertedCorpus-20260920-mining below.
- name: ConvertedCorpus-20260926-unnatural-phrasing-mining
  path: Files/Converted
  sampleFingerprint: n/a - not a TranslationAssessmentWorkflow run
  sampleSize: n/a
  sampleSeed: n/a
  selection: >-
    8 detection items hand-mined directly from Files/Converted to test the new UNNATURAL_PHRASING DEFECT category (added alongside this batch - see QcDefectCategory.cs, the shared BaseQualityReviewPrompt.txt, and docs/investigations/tests/qc-qualityscore-noise-investigation.md for the reported line that motivated it). 3 Defect/unnatural-phrasing items (the reported "角色获取的额外内力上限" line itself, its immediate sibling "角色获取的额外生命上限", and a structurally distinct "初始获得随机秘籍" example) plus 5 clean Pass baselines deliberately drawn from the same terse UI/stat-label register the HARD_TO_PARSE_SEAM carve-out already protects, to directly test false-positive risk on exactly that register. A ~10-item smoke test, not a hand-validated precision sample - the category starts outside autoAcceptDefectCategories and stays there until a real corpus-volume validation pass is run as follow-up work. Items sourced from this batch set sampleRun: ConvertedCorpus-20260926-unnatural-phrasing-mining below.
- name: FlaggedQueue-20260926-mining
  path: Files/Converted
  sampleFingerprint: n/a - not a TranslationAssessmentWorkflow run
  sampleSize: n/a
  sampleSeed: n/a
  selection: >-
    8 detection items hand-mined from the corpus's existing flaggedForQcReview: true queue (376 items across the corpus as of this mining pass), 2 each from 4 of the gold set's thinnest established categories (LostIdiom, DroppedStutter, GarbledNumber, UntranslatedPinyin), chosen for being unambiguous single-defect examples where production's own qcDefectCategory call was independently re-confirmed correct on inspection (as opposed to the many flagged rows spanning multi-part templated cells where the visible defect and the flagged qcDefectCategory did not obviously line up without deeper digging). The two items mined as UntranslatedPinyin surfaced a real category-definition gap: every UntranslatedPinyin-flagged row actually found in this pass was the mirror-image direction of that category's literal definition (a term that should stay Pinyin got mistranslated into an English gloss, not a term left in Pinyin that should have been translated). Fixed the same day this was found - BaseQualityReviewPrompt.txt's UNTRANSLATED_PINYIN/OTHER_NAMED_DEFECT bullets and QcDefectCategory.cs's doc comments now state explicitly that this reverse direction is OTHER_NAMED_DEFECT, not UNTRANSLATED_PINYIN - so these two items (4de67554e9244783/7a9b4022c55d8896) are labeled mistranslation in this gold set, matching the corrected category boundary rather than production's original (pre-fix) label. Items sourced from this batch set sampleRun: FlaggedQueue-20260926-mining below.
- name: ConvertedCorpus-20260926-concrete-noun-mining
  path: Files/Converted
  sampleFingerprint: n/a - not a TranslationAssessmentWorkflow run
  sampleSeed: n/a
  sampleSize: n/a
  selection: >-
    11 short martial-arts skill/item/weapon names hand-mined from Files/Converted/dynamicStringsFromColumns.txt.yaml after 三尸蜈蚣爪 (8c1504d4fd25c3fa, Scorpion for centipede) was found shipping with qcStatus Passed. A scan for creature characters whose English rendering lacked the matching creature word found a real QC blind spot - a concrete noun in a name swapped for a different one (蜈蚣 as Earthworm), dropped (千蛛万毒手 with no spiders) or invented (灵蛇 as Dragon Serpent) - which QC passed in almost every case. 7 Defect items plus 4 Pass controls using the same creatures (蝎尾鞭, 银蛇枪法, 蛇鹤八打, 灵蛇杖法) so the evaluator is tested on distinguishing right from wrong, not on reacting to any creature word. Added BEFORE the prompt fix meant to address them, so the current prompt is baselined on them first. Borderline cases deliberately left out: 鱼肠剑法 (fish dropped from a famous sword name) and 控鹤功 (Featherfall Technique, crane dropped).
- name: ConvertedCorpus-20261004-pronoun-mining
  path: Files/Converted
  sampleFingerprint: n/a - not a TranslationAssessmentWorkflow run
  sampleSize: n/a
  sampleSeed: n/a
  selection: >-
    16 single-candidate items hand-mined from Files/Converted for two reported translation habits of the Qwen25 translator: (a) inventing he/she/his/him where the source states no gender (a subject-omitted stage direction, a hermit, a beggar, a poem title) instead of singular "they/their", and (b) flipping second person to first or third person (你 rendered as "my", "me" or "them", or a speaker's 我 rendered as "he"). 10 Defect items (all pronoun-attribution) plus 6 Pass controls where the source states gender (他/她) or the translation correctly uses "they/their" or "you", so a prompt change is tested for over-correction as well. Candidates were found with a throwaway keyword scan, then each line read individually; ambiguous cases (NPC stage directions where "I" could be the actor) were left out. The 10 Defect sources are also pinned in Config.yaml pinnedSampleSources so every assessment run re-translates them. Items sourced from this batch set sampleRun: ConvertedCorpus-20261004-pronoun-mining below.
- name: ConvertedCorpus-20261004-pronoun-mining-2
  path: Files/Converted
  sampleFingerprint: n/a - not a TranslationAssessmentWorkflow run
  sampleSize: n/a
  sampleSeed: n/a
  selection: >-
    Second pronoun batch, 25 single-candidate items mined from Files/Converted after the first 16 (ConvertedCorpus-20261004-pronoun-mining), widening file coverage beyond PlotData (dynamicStrings, dumpedPrefabText*). 11 Defect items (all pronoun-attribution): six invented he/his in subject-omitted lines, four 你 rendered as "them", "I" or "the two of them", and one garbled "this couple". 14 Pass controls: ungendered 此人/这人/对方 correctly rendered as "they/them", explicit 他 kept gendered, 你/你们 kept as "you", and named speakers (我宋廉庭, 我沈退) kept as "I". The 11 Defect sources are also pinned in Config.yaml pinnedSampleSources. Items sourced from this batch set sampleRun: ConvertedCorpus-20261004-pronoun-mining-2 below.
- name: ConvertedCorpus-20261004-first-person-mining
  path: Files/Converted
  sampleFingerprint: n/a - not a TranslationAssessmentWorkflow run
  sampleSize: n/a
  sampleSeed: n/a
  selection: >-
    18 single-candidate items mined from Files/Converted after the reported "I where it should be you" habit. A scan of 4231 translations with first-person "I/my/me" and no first-person word in the source found most are legitimate (dialogue drops 我 and the speaker is the right subject). The real defect is omitted-subject NARRATION (只见/只听/行至/忽然听闻) rendered "I see/I heard" when the game narrates to the player in second person. 10 Defect items of that shape (PlotData, dynamicStrings) plus 8 Pass controls where "I" is correct (speaker dialogue, parenthesised inner thoughts, 听闻 in direct address), so a narration rule is tested for turning speech into "you". Narration voice in PlotData is mixed (about 79 "I" vs 153 "you" among narration openers), so these defects are the clear-cut dynamicStrings/second-person shapes, not every "I". All 18 are pinned in Config.yaml pinnedSampleSources. Items sourced from this batch set sampleRun: ConvertedCorpus-20261004-first-person-mining below.
