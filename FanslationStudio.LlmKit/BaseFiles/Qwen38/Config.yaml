apiKeyRequired: false
url: "http://localhost:11434/api/chat"
model: "hf.co/unsloth/Qwen3.8-27B-GGUF:UD-IQ4_XS"
#model: "hf.co/unsloth/Qwen3.8-27B-GGUF:UD-Q3_K_XL"
#model: qwen38-27B-2048-unsloth
modelParams:
  temperature: 0.15
  top_p: 0.92
  top_k: 40
  repeat_penalty: 1.05
  frequency_penalty: 0
  presence_penalty: 0
  # num_ctx lowered 8192 -> 4096 2026-09-20: measured real QC-review prompt+completion token usage
  # via direct /api/chat calls against the longest gold-set SOURCE and a representative
  # correction call - detection peaked at ~2783 total tokens (prompt_eval_count 2773 + eval_count
  # 10), correction at ~1050 total. 4096 keeps >1300 tokens of headroom above the worst case
  # measured while roughly halving the KV-cache memory footprint, which is what was pushing the
  # larger quants (Q4_K_M, 17.74GB) into a CPU/GPU split on this 16GB-VRAM card. num_predict left
  # at 4096 (actual completion length measured at 10-70 tokens) since it only caps generation
  # length, not KV-cache size, and a correction call legitimately needs room for a full rewritten
  # translation.
  # num_ctx raised back 4096 -> 8192 2026-09-26: BaseQualityReviewPrompt.txt had grown enough
  # (prompt tidy + UNNATURAL_PHRASING) that glossary-heavy fullCell detection prompts reached
  # 4096-4108 tokens - the server 400'd them outright (exceed_context_size_error, ~30ms "Unscored")
  # or truncated the answer mid-token ("DEFECTS: HARD_TO_PARSE_SE"). Measured on the UD-IQ4_XS
  # quant via /api/ps: 4096 -> 8192 only grows the loaded footprint ~14.1GB -> ~14.4GB (the model
  # was already ~1.1GB CPU-split at 4096 alongside desktop VRAM use), so the headroom is ~free.
  # Re-measure prompt_eval_count against this ceiling after any large QC prompt growth.
  # num_ctx lowered 8192 -> 6144 2026-10-03: the larger KV cache was the main QC slowdown, more
  # than the prompt growth itself (gold-set median detection 873ms at 8192 vs 694ms at 6144, same
  # prompt, recall/precision unchanged; 8192 also sat at ~15.8/16.3GB VRAM and crashed the runner
  # once). Full-corpus measurement: the detection system prompt alone is 4585 tokens and the
  # largest whole detection prompt 5450, so 6144 leaves ~690. QualityReviewWorkflow re-checks this
  # at the start of every review pass and fails fast if a prompt would not fit.
  # Tried OLLAMA_FLASH_ATTENTION=1 + OLLAMA_KV_CACHE_TYPE=q8_0 the same day: KV cache 512 -> 272MB
  # (hybrid model - only 16/64 layers have KV), but still 63/66 layers offloaded, and the gold-set
  # run was ~12% slower (avg 1469 -> 1653ms) with quality unchanged within noise. Not worth it.
  # num_gpu: 999 (force 66/66 layers onto the 16GB card), clean retest with nothing else on the
  # GPU: ~15% faster once settled (median ~1000 vs ~1200ms per detection call), but VRAM sits at
  # ~15.9/16.3GB and the first quarter of the gold-set run stalled badly (26 calls >5s vs 1 on the
  # default split). Any other VRAM user (a game, browser) makes that worse - an earlier run with a
  # stray llama-server alive went ~15x slower. Left off (Ollama's default split) as the safe choice.
  num_ctx: 6144
  num_predict: 4096
structuredTextModelParams:
  temperature: 0
  top_p: 0.95
  top_k: 0
  repeat_penalty: 1.0
  frequency_penalty: 0
  presence_penalty: 0
  num_ctx: 2048
  num_predict: 512