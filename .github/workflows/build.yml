name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore FanslationStudio.LlmKit/FanslationStudio.LlmKit.csproj

      - name: Build
        run: dotnet build FanslationStudio.LlmKit/FanslationStudio.LlmKit.csproj --no-restore --configuration Release

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Generate version
        id: version
        run: echo "VERSION=$(date +'%Y.%m.%d.%H.%M')" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore FanslationStudio.LlmKit/FanslationStudio.LlmKit.csproj

      - name: Build
        run: dotnet build FanslationStudio.LlmKit/FanslationStudio.LlmKit.csproj --no-restore --configuration Release

      - name: Publish
        run: dotnet publish FanslationStudio.LlmKit/FanslationStudio.LlmKit.csproj --no-build --configuration Release --output ./publish

      - name: Zip artifact
        run: zip -r FanslationStudio.LlmKit-v${{ steps.version.outputs.VERSION }}.zip ./publish

      - name: Pack
        run: dotnet pack FanslationStudio.LlmKit/FanslationStudio.LlmKit.csproj --no-build --configuration Release -p:PackageVersion=${{ steps.version.outputs.VERSION }} --output ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          files: FanslationStudio.LlmKit-v${{ steps.version.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
